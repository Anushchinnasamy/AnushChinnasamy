<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace; }
    </style>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#9FFF6E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9FFF6E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="260" rx="8" fill="#0A0A0A"/>
  <rect width="1000" height="260" rx="8" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="259" rx="8" fill="none" stroke="#1E211E"/>

  <!-- top nav bar -->
  <rect x="24" y="24" width="952" height="44" rx="6" fill="#101210" stroke="#1E211E"/>
  <rect x="40" y="35" width="22" height="22" rx="4" fill="#0A0A0A" stroke="#2A2E2A"/>
  <text x="51" y="50" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#9FFF6E">AC</text>
  <text x="76" y="46" class="mono" font-size="13" font-weight="700" fill="#EDEDE8">Anush Chinnasamy</text>
  <text x="76" y="59" class="mono" font-size="9" fill="#5C5F5A">Java Backend Developer / GenAI Engineer</text>

  <circle cx="890" cy="46" r="3" fill="#9FFF6E"/>
  <text x="900" y="49" class="mono" font-size="9" fill="#8A8D87">ONLINE</text>

  <!-- terminal boot block -->
  <rect x="24" y="86" width="440" height="94" rx="6" fill="#101210" stroke="#1E211E"/>
  <text x="40" y="110" class="mono" font-size="11" fill="#5C5F5A">$ whoami</text>
  <text x="40" y="128" class="mono" font-size="11" fill="#9FFF6E">&gt; anush_chinnasamy</text>
  <text x="40" y="146" class="mono" font-size="11" fill="#5C5F5A">$ status --check</text>
  <text x="40" y="164" class="mono" font-size="11" fill="#9FFF6E">&gt; systems nominal. all services online.</text>

  <!-- headline -->
  <text x="500" y="118" class="mono" font-size="26" font-weight="700" fill="#EDEDE8">Building Scalable Systems.</text>
  <text x="500" y="150" class="mono" font-size="26" font-weight="700" fill="#9FFF6E">Powering AI Solutions.</text>
  <text x="500" y="176" class="mono" font-size="12" fill="#8A8D87">1.7+ years · Java / Spring Boot · Microservices · GenAI</text>

  <!-- info strip -->
  <rect x="24" y="196" width="952" height="40" rx="6" fill="#101210" stroke="#1E211E"/>
  <text x="40" y="220" class="mono" font-size="10" fill="#5C5F5A">LOCATION</text>
  <text x="112" y="220" class="mono" font-size="10" fill="#EDEDE8">Chennai, India</text>
  <text x="240" y="220" class="mono" font-size="10" fill="#5C5F5A">TIMEZONE</text>
  <text x="312" y="220" class="mono" font-size="10" fill="#EDEDE8">IST (UTC+5:30)</text>
  <text x="440" y="220" class="mono" font-size="10" fill="#5C5F5A">AVAILABILITY</text>
  <text x="530" y="220" class="mono" font-size="10" fill="#9FFF6E">Open to work</text>
  <text x="660" y="220" class="mono" font-size="10" fill="#5C5F5A">CERTS</text>
  <text x="712" y="220" class="mono" font-size="10" fill="#EDEDE8">AZ-900 · AZ-204</text>
